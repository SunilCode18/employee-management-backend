
# Console Appender
appender.console.type = Console
appender.console.name = LoggingToConsole
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d - %c - [%m] - (%p) - %m - %n

# File Appender
appender.file.type = File
appender.file.name = LoggingToFile
appender.file.fileName = logs/MyLogs.log
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d - %c - [%m] - (%p) - %m - %n

# Root Logger
rootLogger.level = info
rootLogger.appenderRef.console.ref = LoggingToConsole
rootLogger.appenderRef.file.ref = LoggingToFile

# Application Logger
logger.application.name = com.springboot.app
logger.application.level = info

# Spring Security Logger
logger.security.name = org.springframework.security
logger.security.level = warn

# Spring Web Logger
logger.web.name = org.springframework.web
logger.web.level = warn
